# Publica a loja no GitHub Pages.
#  - A cada push na branch main, publica a versão atual (deploy normal).
#  - Pela aba Actions > "Deploy no GitHub Pages" > "Run workflow" é possível
#    publicar QUALQUER versão anterior (tag, branch ou commit): é o nosso ROLLBACK.
name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão a publicar (tag como v1.0.0, branch ou SHA). Vazio = main"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Baixar o código da versão escolhida
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.versao || github.sha }}

      - name: Carimbar a versão publicada (build-info.json)
        env:
          REF_PUBLICADA: ${{ inputs.versao || github.ref_name }}
          EVENTO: ${{ github.event_name }}
          EXECUCAO: ${{ github.run_number }}
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          DATA=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{"ref":"%s","commit":"%s","dataDeploy":"%s","evento":"%s","execucao":"%s"}\n' \
            "$REF_PUBLICADA" "$COMMIT" "$DATA" "$EVENTO" "$EXECUCAO" > build-info.json
          echo "Publicando $REF_PUBLICADA (commit $COMMIT) — evento: $EVENTO"
          cat build-info.json

      - name: Validar a release (bloqueia o deploy se algo estiver errado)
        run: |
          node <<'JS'
          const fs = require('fs');
          const vm = require('vm');
          const erros = [];
          const ler = (arq) => JSON.parse(fs.readFileSync(arq, 'utf8'));

          // 1) Config e catálogo precisam ser JSON válidos
          const config = ler('config/app-config.json');
          const jogos = ler(config.catalogoUrl).jogos;
          console.log(`Validando versão ${config.versao}: ${jogos.length} jogos, capas em ${config.pastaCapas}`);

          // 2) Toda capa citada no catálogo precisa existir na pasta configurada
          for (const j of jogos) {
            if (!fs.existsSync(config.pastaCapas + j.capa)) {
              erros.push(`capa ausente: ${config.pastaCapas + j.capa} (${j.id})`);
            }
          }

          const bf = config.blackFriday || {};
          // 3) Promoções só para jogos que existem, com percentual entre 1 e 99
          for (const [id, promo] of Object.entries(bf.promocoes || {})) {
            if (!jogos.some((j) => j.id === id)) erros.push(`promoção para jogo inexistente: ${id}`);
            if (!(promo.percentual > 0 && promo.percentual < 100)) erros.push(`percentual inválido em ${id}`);
          }

          // 4) Intervalo do contador em segundos (>= 1)
          if (bf.ativa && !(bf.intervaloContadorSegundos >= 1)) erros.push('intervaloContadorSegundos deve ser >= 1');

          // 5) A regra de preço precisa funcionar para TODOS os jogos do catálogo
          if (fs.existsSync('js/precos.js')) {
            const ctx = {};
            vm.runInNewContext(fs.readFileSync('js/precos.js', 'utf8'), ctx);
            for (const j of jogos) {
              try {
                const p = ctx.precoComDesconto(j, config);
                if (!(typeof p === 'number' && p > 0 && p <= j.preco)) erros.push(`preço inválido para ${j.id}: ${p}`);
              } catch (e) {
                erros.push(`precoComDesconto quebra em ${j.id}: ${e.message}`);
              }
            }
          }

          if (erros.length) {
            erros.forEach((e) => console.log(`::error::${e}`));
            console.log(`Release REPROVADA: ${erros.length} problema(s). Deploy bloqueado.`);
            process.exit(1);
          }
          console.log('Release APROVADA: todas as verificações passaram.');
          JS

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: publicacao
        uses: actions/deploy-pages@v4
